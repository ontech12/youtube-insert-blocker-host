<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0;
        width: 280px;
        color: #111827;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 14px 8px;
        border-bottom: 1px solid #e5e7eb;
      }
      header img {
        width: 28px;
        height: 28px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      p {
        margin: 0;
        padding: 10px 14px 14px;
        color: #374151;
      }
      ul {
        margin: 0;
        padding: 0 14px 14px 32px;
        color: #374151;
      }
      .ok {
        color: #047857;
        font-weight: 600;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <div>
        <h1>YouTube insert blocked</h1>
        <div class="ok">Active in this browser</div>
      </div>
    </header>
    <p>
      This extension turns off YouTube search, browse, and embed menus in:
    </p>
    <ul>
      <li>Google Slides (Insert → Video)</li>
      <li>PowerPoint for the web (Insert → Video → Online Video)</li>
    </ul>
  </body>
</html>
